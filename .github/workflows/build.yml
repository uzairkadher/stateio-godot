name: Godot Test + APK
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
      - run: godot --headless --path . -s res://tests/run_tests.gd

  build-apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p ~/.local/share/godot/export_templates/4.3.0.stable
          cp /tmp/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          cp /tmp/templates/* ~/.local/share/godot/export_templates/4.3.0.stable/
          ls ~/.local/share/godot/export_templates/4.3.stable/
      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" ./build/stateio.apk
          ls -lh build/
      - uses: actions/upload-artifact@v4
        with:
          name: stateio-apk
          path: build/*.apk